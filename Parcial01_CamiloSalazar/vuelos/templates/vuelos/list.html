<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Lista de vuelos</title></head>
<body>
  <h2>Vuelos (ordenados por precio)</h2>
  <table border="1" cellpadding="6">
    <thead>
      <tr><th>ID</th><th>Nombre</th><th>Tipo</th><th>Precio</th></tr>
    </thead>
    <tbody>
    {% for f in flights %}
      <tr>
        <td>{{ f.id }}</td>
        <td>
          {% if f.type == 'Internacional' %}
            <strong>{{ f.name }}</strong>
          {% else %}
            {{ f.name }}
          {% endif %}
        </td>
        <td>{{ f.type }}</td>
        <td {% if f.type == 'Nacional' %}style="color:blue"{% endif %}>
          ${{ f.price }}
        </td>
      </tr>
    {% empty %}
      <tr><td colspan="4">No hay vuelos registrados.</td></tr>
    {% endfor %}
    </tbody>
  </table>
  <p><a href="{% url 'home' %}">Volver</a></p>
</body>
</html>
